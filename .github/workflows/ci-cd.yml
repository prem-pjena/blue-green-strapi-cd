name: CI/CD Pipeline - Build, Push, and Deploy with Terraform

on:
  push:
    branches:
      - main

jobs:
  build-push:
    name: CI - Build and Push Docker Image to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY_URI }}

      - name: Build and Tag Docker Image
        run: |
          docker build -t strapi-repo:$GITHUB_SHA .
          docker tag strapi-repo:$GITHUB_SHA ${{ secrets.ECR_REPOSITORY_URI }}:$GITHUB_SHA
          docker tag strapi-repo:$GITHUB_SHA ${{ secrets.ECR_REPOSITORY_URI }}:latest

      - name: Push Docker Image to ECR
        run: |
          docker push ${{ secrets.ECR_REPOSITORY_URI }}:$GITHUB_SHA
          docker push ${{ secrets.ECR_REPOSITORY_URI }}:latest

  terraform-deployment:
    name: CD - Blue/Green Deployment with Terraform and CodeDeploy
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    env:
     JWT_SECRET: ${{ secrets.JWT_SECRET }}
     ECR_REPOSITORY_URI: ${{ secrets.ECR_REPOSITORY_URI }}
     API_TOKEN_SALT: ${{ secrets.API_TOKEN_SALT }}
     STRAPI_ADMIN_SECRET: ${{ secrets.STRAPI_ADMIN_SECRET }}
     TRANSFER_TOKEN_SALT: ${{ secrets.TRANSFER_TOKEN_SALT }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.4.5

      - name: Configure AWS Credentials for Terraform
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: |
          cd terraform
          terraform init

      - name: Terraform Validate
        run: |
          cd terraform
          terraform validate

      - name: Terraform Plan
        run: |
            cd terraform
            terraform plan -out=tfplan \
              -var="JWT_SECRET=${{ secrets.JWT_SECRET }}" \
              -var="API_TOKEN_SALT=${{ secrets.API_TOKEN_SALT }}" \
              -var="STRAPI_ADMIN_SECRET=${{ secrets.STRAPI_ADMIN_SECRET }}" \
              -var="TRANSFER_TOKEN_SALT=${{ secrets.TRANSFER_TOKEN_SALT }}"
        
        

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -input=false -auto-approve tfplan

      - name: Update Task Definition with New Image URI
        run: |
          IMAGE_URI="${ECR_REPOSITORY_URI}:$GITHUB_SHA"
          jq --arg IMAGE "$IMAGE_URI" '.containerDefinitions[0].image = $IMAGE' taskdef.json > taskdef-temp.json
          mv taskdef-temp.json taskdef.json

      - name: Inject JWT_SECRET into Task Definition
        run: |
          jq --arg JWT_SECRET "$JWT_SECRET" '
            .containerDefinitions[0].environment = (
              (if (.containerDefinitions[0].environment | type) == "array" 
               then .containerDefinitions[0].environment 
               else [] 
               end 
              | map(if .name == "JWT_SECRET" then .value = $JWT_SECRET | . else . end))
              + (if any(.containerDefinitions[0].environment[]; .name == "JWT_SECRET") 
                 then [] 
                 else [{"name":"JWT_SECRET","value":$JWT_SECRET}] 
                 end)
            )
          ' taskdef.json > taskdef-temp.json && mv taskdef-temp.json taskdef.json

      - name: Inject API_TOKEN_SALT into Task Definition
        run: |
          jq --arg API_TOKEN_SALT "$API_TOKEN_SALT" '
            .containerDefinitions[0].environment = (
              (if (.containerDefinitions[0].environment | type) == "array" 
               then .containerDefinitions[0].environment 
               else [] 
               end 
              | map(if .name == "API_TOKEN_SALT" then .value = $API_TOKEN_SALT | . else . end))
              + (if any(.containerDefinitions[0].environment[]; .name == "API_TOKEN_SALT") 
                 then [] 
                 else [{"name":"API_TOKEN_SALT","value":$API_TOKEN_SALT}] 
                 end)
            )
          ' taskdef.json > taskdef-temp.json && mv taskdef-temp.json taskdef.json

      - name: Inject STRAPI_ADMIN_SECRET into Task Definition
        run: |
          jq --arg STRAPI_ADMIN_SECRET "$STRAPI_ADMIN_SECRET" '
            .containerDefinitions[0].environment = (
              (if (.containerDefinitions[0].environment | type) == "array"
               then .containerDefinitions[0].environment
               else []
               end
              | map(if .name == "STRAPI_ADMIN_SECRET" then .value = $STRAPI_ADMIN_SECRET | . else . end))
              + (if any(.containerDefinitions[0].environment[]; .name == "STRAPI_ADMIN_SECRET")
                 then []
                 else [{"name":"STRAPI_ADMIN_SECRET","value":$STRAPI_ADMIN_SECRET}]
                 end)
            )
          ' taskdef.json > taskdef-temp.json && mv taskdef-temp.json taskdef.json

      - name: Inject TRANSFER_TOKEN_SALT into Task Definition
        run: |
         jq --arg TRANSFER_TOKEN_SALT "$TRANSFER_TOKEN_SALT" '
         .containerDefinitions[0].environment = (
         (if (.containerDefinitions[0].environment | type) == "array"
         then .containerDefinitions[0].environment
         else []
         end
         | map(if .name == "TRANSFER_TOKEN_SALT" then .value = $TRANSFER_TOKEN_SALT | . else . end))
         + (if any(.containerDefinitions[0].environment[]; .name == "TRANSFER_TOKEN_SALT")
           then []
           else [{"name":"TRANSFER_TOKEN_SALT","value":$TRANSFER_TOKEN_SALT}]
           end)
         )
         ' taskdef.json > taskdef-temp.json && mv taskdef-temp.json taskdef.json


      - name: Register New Task Definition
        id: register_task
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://taskdef.json | jq -r '.taskDefinition.taskDefinitionArn')
          echo "TASK_DEFINITION_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV

      - name: Create Deployment via CodeDeploy
        run: |
          sed "s|<TASK_DEFINITION>|${{ env.TASK_DEFINITION_ARN }}|g" appspec.yaml > appspec-patched.yaml
          ENCODED_APPSPEC=$(jq -Rs . < appspec-patched.yaml)

          aws deploy create-deployment \
            --cli-input-json "$(jq -n \
              --arg content "$ENCODED_APPSPEC" \
              --arg app "${{ secrets.CODEDEPLOY_APPLICATION_NAME }}" \
              --arg group "${{ secrets.CODEDEPLOY_DEPLOYMENT_GROUP_NAME }}" \
              --arg config "CodeDeployDefault.ECSCanary10Percent5Minutes" \
              '{
                applicationName: $app,
                deploymentGroupName: $group,
                deploymentConfigName: $config,
                revision: {
                  revisionType: "AppSpecContent",
                  appSpecContent: {
                    content: $content
                  }
                }
              }')"

  terraform-destroy:
    name: Terraform Destroy on Failure
    if: failure()
    runs-on: ubuntu-latest
    needs: terraform-deployment
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      API_TOKEN_SALT: ${{ secrets.API_TOKEN_SALT }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.4.5

      - name: Configure AWS Credentials for Terraform
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init (Reconfigure)
        run: |
          cd terraform
          terraform init -reconfigure

      - name: Terraform Destroy
        run: |
          cd terraform
          terraform destroy -auto-approve -input=false \
            -var="JWT_SECRET=${{ secrets.JWT_SECRET }}" \
            -var="API_TOKEN_SALT=${{ secrets.API_TOKEN_SALT }}"
