name: CI/CD Pipeline - Build, Push, and Deploy with Terraform

on:
  push:
    branches:
      - main

jobs:
  # CI - Build and Push Docker Image to ECR
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY_URI }}

      - name: Build Docker image
        run: |
          docker build -t strapi-app:$GITHUB_SHA .
          docker tag strapi-app:$GITHUB_SHA ${{ secrets.ECR_REPOSITORY_URI }}:$GITHUB_SHA

      - name: Push Docker image to ECR
        run: |
          docker push ${{ secrets.ECR_REPOSITORY_URI }}:$GITHUB_SHA

  # CD - Blue/Green Deployment - Strapi App with Terraform
  terraform-deployment:
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.4.5

      - name: Configure AWS Credentials for Terraform
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: List Files in Directory
        run: |
          ls -la terraform  # Adjust this to your terraform files location

      - name: Terraform Init
        run: |
          cd terraform  # Adjust if the terraform files are in a sub-directory
          terraform init

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan -out=tfplan

      - name: Terraform Apply
        run: |
          cd terraform  # Adjust if the terraform files are in a sub-directory
          terraform apply -auto-approve tfplan

      - name: Update Task Definition with new Image
        id: render_taskdef
        run: |
          IMAGE_URI="${{ secrets.ECR_REPOSITORY_URI }}:$GITHUB_SHA"
          jq --arg IMAGE "$IMAGE_URI" '.containerDefinitions[0].image = $IMAGE' taskdef.json > taskdef-temp.json
          mv taskdef-temp.json taskdef.json


      - name: Register New Task Definition
        id: register_task
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://taskdef.json | jq -r '.taskDefinition.taskDefinitionArn')
          echo "task_definition_arn=$TASK_DEF_ARN" >> $GITHUB_ENV

      - name: Create Deployment via CodeDeploy
        run: |
          APPSPEC_CONTENT=$(cat appspec.yml | sed 's/"/\\"/g' | awk '{printf "%s\\n", $0}')
          aws deploy create-deployment \
            --application-name strapi-codedeploy-app \
            --deployment-group-name strapi-codedeploy-deployment-group \
            --deployment-config-name CodeDeployDefault.ECSCanary10Percent5Minutes \
            --revision "revisionType=AppSpecContent,appSpecContent={content=\"$APPSPEC_CONTENT\"}" \
            --target-deployment "{
              \"targetService\": {
                \"type\": \"AWS::ECS::Service\",
                \"properties\": {
                  \"taskDefinition\": \"${{ env.task_definition_arn }}\",
                  \"loadBalancerInfo\": {
                    \"containerName\": \"strapi\",
                    \"containerPort\": 1337
                  }
                }
              }
            }"

      # Step to clean up resources in case of failure
      - name: Terraform Destroy (on failure)
        if: failure()
        run: |
          cd terraform  # Adjust if the terraform files are in a sub-directory
          terraform destroy -auto-approve
